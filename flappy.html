<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        .game-container {
            background: #4ec0ca;
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            position: relative;
        }
        canvas {
            display: block;
            border-radius: 8px;
            background: linear-gradient(180deg, #4ec0ca 0%, #4ec0ca 60%, #73d2de 100%);
            cursor: pointer;
        }
        .score-display {
            position: absolute;
            top: 30px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 48px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.3);
            pointer-events: none;
            z-index: 10;
        }
        .game-over-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            background: rgba(0,0,0,0.6);
            border-radius: 8px;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 20;
            backdrop-filter: blur(2px);
        }
        .game-over-overlay.show {
            display: flex;
        }
        .game-over-title {
            font-size: 48px;
            font-weight: bold;
            color: #e74c3c;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.5);
            margin-bottom: 10px;
        }
        .final-score {
            font-size: 24px;
            color: white;
            margin-bottom: 20px;
        }
        .restart-btn {
            padding: 12px 40px;
            font-size: 20px;
            border: none;
            border-radius: 8px;
            background: #f39c12;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s, background 0.2s;
            box-shadow: 0 4px 0 #c87f0a;
        }
        .restart-btn:hover {
            background: #e67e22;
            transform: translateY(-2px);
        }
        .restart-btn:active {
            transform: translateY(2px);
            box-shadow: 0 0px 0 #c87f0a;
        }
        .instructions {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            text-align: center;
            color: rgba(255,255,255,0.8);
            font-size: 14px;
            pointer-events: none;
            z-index: 10;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
        @media (max-width: 420px) {
            .game-container {
                padding: 5px;
            }
            .score-display {
                font-size: 36px;
                top: 20px;
            }
            .game-over-title {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        <div class="score-display" id="scoreDisplay">0</div>
        <div class="game-over-overlay" id="gameOverOverlay">
            <div class="game-over-title">GAME OVER</div>
            <div class="final-score" id="finalScore">Score: 0</div>
            <button class="restart-btn" id="restartBtn">RESTART</button>
        </div>
        <div class="instructions">Tekan Spasi, Klik, atau Tap untuk terbang</div>
    </div>

    <script>
        // ===================== SETUP =====================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const finalScore = document.getElementById('finalScore');
        const restartBtn = document.getElementById('restartBtn');

        const W = 400;
        const H = 600;

        // ===================== GAME STATE =====================
        let game = {
            bird: null,
            pipes: [],
            score: 0,
            highScore: parseInt(localStorage.getItem('flappyHighScore')) || 0,
            started: false,
            gameOver: false,
            frame: 0,
            gravity: 0.5,
            flapStrength: -8,
            pipeSpeed: 3,
            pipeGap: 150,
            pipeWidth: 50,
            pipeSpawnInterval: 100, // frames
            pipeCounter: 0,
        };

        // ===================== BIRD =====================
        class Bird {
            constructor() {
                this.x = 80;
                this.y = H / 2;
                this.width = 34;
                this.height = 24;
                this.velocity = 0;
                this.rotation = 0;
                this.radius = 12;
            }

            flap() {
                if (game.gameOver) return;
                if (!game.started) {
                    game.started = true;
                }
                this.velocity = game.flapStrength;
                // Play a simple sound effect using beep
                playFlapSound();
            }

            update() {
                // Gravity
                this.velocity += game.gravity;
                this.y += this.velocity;

                // Rotation based on velocity
                if (this.velocity < -2) {
                    this.rotation = -25;
                } else if (this.velocity > 2) {
                    this.rotation = Math.min(this.velocity * 3, 90);
                } else {
                    this.rotation = this.velocity * 5;
                }

                // Check bounds
                if (this.y + this.height / 2 > H - 20) {
                    this.y = H - 20 - this.height / 2;
                    gameOver();
                }
                if (this.y - this.height / 2 < 0) {
                    this.y = this.height / 2;
                    this.velocity = 0;
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate((this.rotation * Math.PI) / 180);

                // Body
                const grad = ctx.createRadialGradient(0, 0, 2, 0, 0, 18);
                grad.addColorStop(0, '#f5d442');
                grad.addColorStop(0.7, '#e8b82a');
                grad.addColorStop(1, '#c99a1a');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.ellipse(0, 0, 18, 13, 0, 0, Math.PI * 2);
                ctx.fill();

                // Wing
                ctx.fillStyle = '#d4941a';
                ctx.beginPath();
                ctx.ellipse(-6, 2, 12, 8, -0.3, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#b87a10';
                ctx.beginPath();
                ctx.ellipse(-4, 3, 8, 5, -0.3, 0, Math.PI * 2);
                ctx.fill();

                // Tail
                ctx.fillStyle = '#c9891a';
                ctx.beginPath();
                ctx.moveTo(-16, -2);
                ctx.lineTo(-24, -6);
                ctx.lineTo(-22, 0);
                ctx.lineTo(-24, 5);
                ctx.closePath();
                ctx.fill();

                // Eye
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.ellipse(8, -3, 6, 7, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#2c3e50';
                ctx.beginPath();
                ctx.ellipse(10, -3, 3.5, 4, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(12, -5, 1.8, 0, Math.PI * 2);
                ctx.fill();

                // Beak
                ctx.fillStyle = '#e67e22';
                ctx.beginPath();
                ctx.moveTo(15, -1);
                ctx.lineTo(24, 2);
                ctx.lineTo(15, 4);
                ctx.closePath();
                ctx.fill();
                ctx.fillStyle = '#d35400';
                ctx.beginPath();
                ctx.moveTo(15, 1);
                ctx.lineTo(22, 2);
                ctx.lineTo(15, 3);
                ctx.closePath();
                ctx.fill();

                ctx.restore();
            }

            getBounds() {
                return {
                    x: this.x - this.width / 2,
                    y: this.y - this.height / 2,
                    width: this.width,
                    height: this.height
                };
            }
        }

        // ===================== PIPE =====================
        class Pipe {
            constructor(x) {
                this.x = x;
                this.width = game.pipeWidth;
                this.gap = game.pipeGap;
                this.gapY = Math.random() * (H - 180 - this.gap) + 90;
                this.scored = false;
                this.passed = false;
            }

            update() {
                this.x -= game.pipeSpeed;
            }

            draw() {
                const topHeight = this.gapY;
                const bottomY = this.gapY + this.gap;
                const bottomHeight = H - bottomY;

                // Top pipe
                this.drawPipe(ctx, this.x, 0, this.width, topHeight, false);
                // Bottom pipe
                this.drawPipe(ctx, this.x, bottomY, this.width, bottomHeight, true);
            }

            drawPipe(ctx, x, y, w, h, isBottom) {
                // Pipe body
                const grad = ctx.createLinearGradient(x, 0, x + w, 0);
                grad.addColorStop(0, '#5cad3a');
                grad.addColorStop(0.2, '#7ed156');
                grad.addColorStop(0.5, '#8fd860');
                grad.addColorStop(0.8, '#7ed156');
                grad.addColorStop(1, '#4a9a2a');
                ctx.fillStyle = grad;
                ctx.fillRect(x, y, w, h);

                // Pipe border
                ctx.strokeStyle = '#3a7a1a';
                ctx.lineWidth = 2;
                ctx.strokeRect(x, y, w, h);

                // Pipe inner shadow
                const innerGrad = ctx.createLinearGradient(x + 2, 0, x + w - 4, 0);
                innerGrad.addColorStop(0, 'rgba(0,0,0,0.1)');
                innerGrad.addColorStop(0.3, 'rgba(255,255,255,0.15)');
                innerGrad.addColorStop(0.6, 'rgba(255,255,255,0.1)');
                innerGrad.addColorStop(1, 'rgba(0,0,0,0.15)');
                ctx.fillStyle = innerGrad;
                ctx.fillRect(x + 2, y, w - 4, h);

                // Pipe lip (end cap)
                const lipH = 20;
                const lipW = w + 10;
                const lipX = x - 5;
                let lipY;
                if (!isBottom) {
                    lipY = y + h - lipH;
                } else {
                    lipY = y;
                }

                const lipGrad = ctx.createLinearGradient(lipX, 0, lipX + lipW, 0);
                lipGrad.addColorStop(0, '#4a9a2a');
                lipGrad.addColorStop(0.2, '#6bc944');
                lipGrad.addColorStop(0.5, '#7ed156');
                lipGrad.addColorStop(0.8, '#6bc944');
                lipGrad.addColorStop(1, '#3a8a1a');
                ctx.fillStyle = lipGrad;
                ctx.fillRect(lipX, lipY, lipW, lipH);

                ctx.strokeStyle = '#2a6a0a';
                ctx.lineWidth = 2;
                ctx.strokeRect(lipX, lipY, lipW, lipH);

                // Highlight on lip
                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                ctx.fillRect(lipX + 3, lipY + 2, lipW - 6, lipH / 3);

                // Dark lines on pipe body
                ctx.strokeStyle = 'rgba(0,0,0,0.08)';
                ctx.lineWidth = 1;
                for (let i = 0; i < h; i += 25) {
                    const lineY = !isBottom ? y + i : y + i;
                    if (lineY < (isBottom ? y + h : y + h)) {
                        ctx.beginPath();
                        ctx.moveTo(x + 3, lineY);
                        ctx.lineTo(x + w - 3, lineY);
                        ctx.stroke();
                    }
                }
            }

            getBounds() {
                return {
                    top: { x: this.x, y: 0, width: this.width, height: this.gapY },
                    bottom: { x: this.x, y: this.gapY + this.gap, width: this.width, height: H - (this.gapY + this.gap) }
                };
            }

            isOffScreen() {
                return this.x + this.width < 0;
            }
        }

        // ===================== SOUND =====================
        function playFlapSound() {
            try {
                const actx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = actx.createOscillator();
                const gain = actx.createGain();
                osc.connect(gain);
                gain.connect(actx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(500, actx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(700, actx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.15, actx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.1);
                osc.start(actx.currentTime);
                osc.stop(actx.currentTime + 0.1);
            } catch(e) {}
        }

        function playScoreSound() {
            try {
                const actx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = actx.createOscillator();
                const gain = actx.createGain();
                osc.connect(gain);
                gain.connect(actx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, actx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, actx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.12, actx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.15);
                osc.start(actx.currentTime);
                osc.stop(actx.currentTime + 0.15);
            } catch(e) {}
        }

        function playDeathSound() {
            try {
                const actx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = actx.createOscillator();
                const gain = actx.createGain();
                osc.connect(gain);
                gain.connect(actx.destination);
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(400, actx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, actx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.15, actx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.3);
                osc.start(actx.currentTime);
                osc.stop(actx.currentTime + 0.3);
            } catch(e) {}
        }

        // ===================== GAME FUNCTIONS =====================
        function resetGame() {
            game.bird = new Bird();
            game.pipes = [];
            game.score = 0;
            game.started = false;
            game.gameOver = false;
            game.frame = 0;
            game.pipeCounter = 0;
            scoreDisplay.textContent = '0';
            gameOverOverlay.classList.remove('show');
            updateHighScoreDisplay();
        }

        function gameOver() {
            if (game.gameOver) return;
            game.gameOver = true;
            playDeathSound();
            // Update high score
            if (game.score > game.highScore) {
                game.highScore = game.score;
                localStorage.setItem('flappyHighScore', game.highScore);
            }
            finalScore.textContent = 'Score: ' + game.score + '  |  Best: ' + game.highScore;
            gameOverOverlay.classList.add('show');
        }

        function addScore() {
            game.score++;
            scoreDisplay.textContent = game.score;
            playScoreSound();
        }

        function updateHighScoreDisplay() {
            // Could update a high score badge
        }

        function spawnPipe() {
            const lastPipe = game.pipes[game.pipes.length - 1];
            if (lastPipe && lastPipe.x > W - 200) return; // Too close to last pipe
            game.pipes.push(new Pipe(W + 20));
        }

        // ===================== COLLISION DETECTION =====================
        function checkCollisions() {
            const bird = game.bird;
            const bx = bird.x - bird.radius;
            const by = bird.y - bird.radius;
            const br = bird.radius;

            // Simplified: circle-rect collision for each pipe
            for (const pipe of game.pipes) {
                const bTop = pipe.getBounds().top;
                const bBottom = pipe.getBounds().bottom;

                // Top pipe
                if (circleRectCollision(bx, by, br, bTop.x, bTop.y, bTop.width, bTop.height)) {
                    return true;
                }
                // Bottom pipe
                if (circleRectCollision(bx, by, br, bBottom.x, bBottom.y, bBottom.width, bBottom.height)) {
                    return true;
                }
            }

            // Ground collision
            if (bird.y + bird.radius > H - 20) {
                return true;
            }

            // Ceiling collision (optional game over)
            if (bird.y - bird.radius < 0) {
                // Just bounce, no game over
            }

            return false;
        }

        function circleRectCollision(cx, cy, cr, rx, ry, rw, rh) {
            const closestX = Math.max(rx, Math.min(cx, rx + rw));
            const closestY = Math.max(ry, Math.min(cy, ry + rh));
            const dx = cx - closestX;
            const dy = cy - closestY;
            return (dx * dx + dy * dy) < (cr * cr);
        }

        // ===================== BACKGROUND =====================
        let bgOffset = 0;
        function drawBackground() {
            // Sky gradient
            const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
            skyGrad.addColorStop(0, '#4ec0ca');
            skyGrad.addColorStop(0.6, '#73d2de');
            skyGrad.addColorStop(0.85, '#8ee5f0');
            skyGrad.addColorStop(1, '#a0f0f8');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, W, H);

            // Clouds
            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            const cloudPositions = [
                { x: 50 + bgOffset * 0.2 % 500, y: 80, s: 1.2 },
                { x: 200 + bgOffset * 0.15 % 600 - 100, y: 120, s: 1.0 },
                { x: 350 + bgOffset * 0.25 % 450 - 50, y: 60, s: 0.9 },
                { x: 100 + bgOffset * 0.18 % 550 - 50, y: 160, s: 0.7 },
                { x: 300 + bgOffset * 0.22 % 500 - 50, y: 100, s: 1.1 },
            ];
            for (const c of cloudPositions) {
                let cx = c.x;
                if (cx > W + 50) cx -= W + 100;
                if (cx < -50) cx += W + 100;
                ctx.beginPath();
                ctx.ellipse(cx, c.y, 30 * c.s, 15 * c.s, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(cx + 25 * c.s, c.y - 5 * c.s, 25 * c.s, 18 * c.s, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(cx + 45 * c.s, c.y - 2 * c.s, 20 * c.s, 12 * c.s, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            // Mountains / hills in background
            ctx.fillStyle = 'rgba(60, 130, 60, 0.3)';
            ctx.beginPath();
            ctx.moveTo(0, H - 80);
            for (let x = 0; x <= W; x += 10) {
                const y = H - 80 - Math.sin(x * 0.008 + bgOffset * 0.01) * 30 - Math.sin(x * 0.015 + bgOffset * 0.005) * 15;
                ctx.lineTo(x, y);
            }
            ctx.lineTo(W, H - 20);
            ctx.lineTo(0, H - 20);
            ctx.closePath();
            ctx.fill();

            // Ground
            ctx.fillStyle = '#5a3a1a';
            ctx.fillRect(0, H - 20, W, 20);

            // Grass on top of ground
            ctx.fillStyle = '#6d8c3e';
            ctx.fillRect(0, H - 22, W, 4);

            // Ground details
            ctx.strokeStyle = 'rgba(0,0,0,0.1)';
            ctx.lineWidth = 1;
            for (let x = 0; x < W; x += 15) {
                const offsetX = (x + bgOffset) % 30 - 15;
                ctx.beginPath();
                ctx.moveTo(x + offsetX, H - 20);
                ctx.lineTo(x + offsetX + 5, H - 12);
                ctx.stroke();
            }

            bgOffset += 0.5;
        }

        // ===================== MAIN LOOP =====================
        function update() {
            if (game.gameOver) return;

            if (game.started) {
                // Update bird
                game.bird.update();

                // Spawn pipes
                game.pipeCounter++;
                if (game.pipeCounter >= game.pipeSpawnInterval) {
                    spawnPipe();
                    game.pipeCounter = 0;
                    // Gradually increase difficulty
                    game.pipeSpawnInterval = Math.max(65, game.pipeSpawnInterval - 0.2);
                }

                // Update pipes
                for (let i = game.pipes.length - 1; i >= 0; i--) {
                    const pipe = game.pipes[i];
                    pipe.update();

                    // Remove off-screen pipes
                    if (pipe.isOffScreen()) {
                        game.pipes.splice(i, 1);
                        continue;
                    }

                    // Score check
                    if (!pipe.scored && pipe.x + pipe.width < game.bird.x) {
                        pipe.scored = true;
                        addScore();
                    }
                }

                // Collision detection
                if (checkCollisions()) {
                    gameOver();
                }
            }

            game.frame++;
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);

            // Background
            drawBackground();

            // Draw pipes
            for (const pipe of game.pipes) {
                pipe.draw();
            }

            // Draw bird
            if (game.bird) {
                game.bird.draw();
            }

            // Draw score on canvas too (big overlay)
            if (game.started && !game.gameOver) {
                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                ctx.font = 'bold 80px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.fillText(game.score, W / 2, 40);
            }

            // "Tap to start" message
            if (!game.started && !game.gameOver) {
                ctx.fillStyle = 'rgba(255,255,255,0.9)';
                ctx.font = 'bold 24px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('Tap / Spasi untuk mulai', W / 2, H / 2 - 40);

                ctx.fillStyle = 'rgba(255,255,255,0.6)';
                ctx.font = '16px Arial';
                ctx.fillText('Flappy Bird', W / 2, H / 2 - 90);

                // Draw a bouncing arrow
                const bounceY = Math.sin(game.frame * 0.08) * 8;
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.font = '36px Arial';
                ctx.fillText('▼', W / 2, H / 2 + 20 + bounceY);
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // ===================== INPUT HANDLING =====================
        function handleInput(e) {
            if (e) e.preventDefault();
            if (game.gameOver) return;
            if (game.bird) {
                game.bird.flap();
            }
        }

        // Keyboard
        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.key === 'Space') {
                handleInput(e);
            }
        });

        // Mouse click on canvas
        canvas.addEventListener('click', handleInput);

        // Touch support
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handleInput(e);
        });

        // Restart button
        restartBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            resetGame();
        });

        // ===================== START GAME =====================
        resetGame();
        gameLoop();

        // Handle window resize (keep aspect ratio)
        function resizeCanvas() {
            const container = document.querySelector('.game-container');
            const maxWidth = window.innerWidth - 20;
            const maxHeight = window.innerHeight - 20;
            const aspect = W / H;
            let containerW = Math.min(maxWidth, 420);
            let containerH = containerW / aspect;
            if (containerH > maxHeight) {
                containerH = maxHeight;
                containerW = containerH * aspect;
            }
            container.style.width = containerW + 'px';
            container.style.height = containerH + 'px';
            canvas.style.width = '100%';
            canvas.style.height = '100%';
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        console.log('Flappy Bird started!');
        console.log('Tekan Spasi atau Klik untuk terbang!');
    </script>
</body>
</html>
